include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # These are helpful but noisy in a work-in-progress shell app
    todo: ignore
    unused_element: warning
    unused_field: warning
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - avoid_print
