name: thewearco
description: TheWearCo mobile app — shop apparel & custom prints.
publish_to: "none"
version: 1.2.0+12

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP
  dio: ^5.5.0

  # Routing
  go_router: ^14.2.7

  # Persistence (cart)
  shared_preferences: ^2.3.2

  # Formatting
  intl: ^0.19.0

  # Fonts
  google_fonts: ^6.2.1

  # Design tab — pick artwork from gallery / camera and share the
  # generated mockup as a PNG.
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  share_plus: ^10.1.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/products.json
    - assets/icon/app_icon.png
